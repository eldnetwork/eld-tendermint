name: image

on:
  push:
    branches:
      - eld/v0.34.24
    tags:
      - v0.34.24-eld.*
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# CI jobs only read the repo. The image job grants packages: write.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify upstream import is an ancestor
        run: |
          git merge-base --is-ancestor 014cdcf09844d48f6d30f3e520034b7edffd9670 HEAD
          grep -q 'TMVersionDefault = "0.34.24"' version/version.go

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.18.10"
      - name: Build tendermint
        run: go build -o /tmp/tendermint ./cmd/tendermint
      - name: Test
        run: bash scripts/ci.sh test

  image:
    # A custom if replaces the default success() check. Keep success() so a
    # failed verify or go job cannot publish. Branch pushes stay in CI only:
    # eld/v0.34.24 is not a legal Docker tag.
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.34.24-eld.')
    runs-on: ubuntu-latest
    needs: [verify, go]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{raw}}
            type=sha
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record image digest
        run: |
          {
            echo "### Image"
            echo "ref: ${{ github.ref_name }}"
            echo "tags: ${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
